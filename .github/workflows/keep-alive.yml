name: Supabase keep-alive

# Stops the free-tier Supabase project from auto-pausing after 7 days idle.
# Runs a tiny read against the database every 3 days (and can be run manually).

on:
  schedule:
    - cron: "0 9 */3 * *"   # 09:00 UTC, every 3 days
  workflow_dispatch:          # lets you run it on demand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_KEY secret is missing."
            exit 1
          fi
          echo "Pinging $SUPABASE_URL ..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/app_state?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Supabase responded — project kept alive."
          else
            echo "::error::Unexpected status $HTTP_CODE from Supabase."
            exit 1
          fi
